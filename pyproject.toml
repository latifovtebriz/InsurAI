[project]
name = "insurai"
version = "0.1.0"
description = "Autonomous Agentic P&C Insurance Core Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.31.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13.3",
    "psycopg[binary]>=3.2.1",
    "pgvector>=0.3.5",
    "pyjwt>=2.9.0",
    "reportlab>=4.2.5",
    "httpx>=0.27.2",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "hypothesis>=6.112.0",
    "ruff>=0.6.8",
    "mypy>=1.11.2",
    "import-linter>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "dist",
    "build",
    "frontend",
    "data",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
]
ignore = [
    "E501", # line too long (handled by formatter)
    "B008", # do not perform function call in argument defaults (FastAPI Depends idiom)
]

[tool.ruff.lint.per-file-ignores]
"evals/*" = ["E402"]
"scripts/*" = ["E402"]


[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = [
    "frontend/",
    "data/",
    ".venv/",
    "build/",
    "dist/",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = [".", "backend"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests requiring external services (PostgreSQL, pgvector)",
    "architecture: marks architecture and module boundary tests",
    "slow: marks slow tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "Modules must communicate only through public interfaces"
type = "layers"
containers = ["app.modules"]
layers = [
    "reinsurance",
    "claims",
    "policy",
    "product",
    "party",
    "platform",
]
