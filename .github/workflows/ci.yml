name: InsurAI CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Create virtual environment and install dependencies
        run: |
          uv venv
          source .venv/bin/activate
          uv pip install -e ".[dev]"

      - name: Run Secret and Hygiene Scanner
        run: |
          source .venv/bin/activate
          python scripts/secret_scanner.py

      - name: Run Ruff Lint and Format Checks
        run: |
          source .venv/bin/activate
          ruff check .
          ruff format --check .

      - name: Run Mypy Type Checks
        run: |
          source .venv/bin/activate
          mypy backend/app

      - name: Run Pytest Suite (Unit and Architecture)
        run: |
          source .venv/bin/activate
          pytest -m "not integration"
