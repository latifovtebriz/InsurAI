repos:
  - repo: local
    hooks:
      - id: secret-scanner
        name: Secret and Hygiene Scanner
        entry: python scripts/secret_scanner.py
        language: system
        pass_filenames: false
      - id: ruff-check
        name: Ruff Linter
        entry: ruff check .
        language: system
        types: [python]
        pass_filenames: false
      - id: mypy-check
        name: Mypy Type Checker
        entry: mypy backend/app
        language: system
        types: [python]
        pass_filenames: false
      - id: pytest-check
        name: Pytest Unit & Architecture Tests
        entry: pytest
        language: system
        pass_filenames: false
